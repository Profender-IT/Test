# dev ในเครื่องผู้พัฒนา · ข้อมูลสังเคราะห์เท่านั้น · พอร์ตต่างจาก SCADA เพื่อรันพร้อมกันได้
name: roombooking-dev
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    environment: { POSTGRES_DB: roombooking, POSTGRES_USER: roombooking_admin, POSTGRES_PASSWORD: "${DEV_PG_PASSWORD:-devpass}" }
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U roombooking_admin -d roombooking"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
  minio:            # ที่เก็บไฟล์แนบ (ถ้า ADR 0002 เลือก object storage)
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server","/data","--console-address",":9001"]
    environment: { MINIO_ROOT_USER: dev, MINIO_ROOT_PASSWORD: "${DEV_MINIO_PASSWORD:-devpass123}" }
    ports: ["127.0.0.1:9000:9000","127.0.0.1:9001:9001"]
    volumes: [minio:/data]
volumes: { pgdata: {}, minio: {} }
