# รันใหม่อัตโนมัติเมื่อ CI ล้ม (เช่น ดาวน์โหลด dependency หรือ docker pull ล้ม) · สูงสุด 2 รอบ · ใช้ runner ของ GitHub
name: retry
on:
  workflow_run:
    workflows: [pr, main, release]
    types: [completed]
permissions: { actions: write }
jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: sleep 60 && gh run rerun ${{ github.event.workflow_run.id }} --failed -R ${{ github.repository }}
