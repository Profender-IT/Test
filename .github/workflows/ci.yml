# ชุดทดสอบกลาง (reusable) · pr.yml / main.yml / release.yml เรียกใช้ · ไม่มีขั้น deploy ใดๆ
# รันบน GitHub-hosted runner ทั้งหมด · Supabase ที่ใช้คือ local stack ใน runner (ข้อมูลสังเคราะห์) ไม่แตะ staging/production
name: ci
on:
  workflow_call: {}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"
  SUPABASE_CLI_VERSION: "3.1.0"

jobs:
  flutter:                    # format + analyze + unit/widget test + build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: build APK (debug · ค่า local ผ่าน --dart-define เท่านั้น)
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=http://10.0.2.2:54321 \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder \
            --dart-define=APP_ENV=ci

  supabase:                   # migration บนฐานว่าง + db lint + pgTAP + Playwright (API + web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: "${{ env.SUPABASE_CLI_VERSION }}" }
      - name: supabase start (local stack ใน runner)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - name: migration รันซ้ำบนฐานว่างได้
        run: supabase db reset
      - name: db lint
        run: supabase db lint --level warning --fail-on error
      - name: pgTAP
        run: supabase test db
      - name: ส่งค่า local Supabase ให้ขั้นถัดไป
        run: |
          s=$(supabase status -o json)
          url=$(echo "$s" | jq -r '.API_URL')
          key=$(echo "$s" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')
          [ -n "$url" ] && [ "$url" != null ] && [ -n "$key" ] && [ "$key" != null ] || { echo "::error::อ่าน API_URL/PUBLISHABLE_KEY จาก supabase status ไม่ได้"; exit 1; }
          echo "::add-mask::$key"
          { echo "SUPABASE_URL=$url"; echo "SUPABASE_PUBLISHABLE_KEY=$key"; } >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: build Flutter web สำหรับ e2e
        working-directory: app
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=APP_ENV=ci \
            --dart-define=E2E_SEMANTICS=true
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }
      - if: always()
        run: supabase stop --no-backup
