# Guardrails + ทดสอบทุก PR · GitHub-hosted runner (ubuntu-latest) ทั้งหมด · ไม่มี deploy
# ตั้ง ruleset ของ main ให้ job เหล่านี้เป็น required status checks: risk, guard, ci / flutter, ci / supabase
name: pr
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:                       # จัดระดับ + จำกัดขนาด + MANUAL_MERGE + จำกัด PR ค้างของ agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.r.outputs.tier }}
      automerge: ${{ steps.r.outputs.automerge }}
      manual: ${{ steps.r.outputs.manual }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: r
        env: { TITLE: "${{ github.event.pull_request.title }}", HEAD_REF: "${{ github.head_ref }}" }
        run: bash scripts/ci/risk.sh "origin/${{ github.base_ref }}" "$HEAD_REF" "$TITLE"
      - name: จำกัด PR ของ agent ที่เปิดพร้อมกัน (ไม่เกิน 3)
        if: startsWith(github.head_ref, 'agent/')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          n=$(gh pr list -R "${{ github.repository }}" --state open --limit 100 --json headRefName \
              -q '[.[] | select(.headRefName | startswith("agent/"))] | length') || { echo "เช็กจำนวนไม่ได้ ข้าม"; exit 0; }
          echo "PR ของ agent ที่เปิดอยู่: $n"
          [ "$n" -le 3 ] || { echo "::error::agent เปิด PR ค้างรีวิว $n รายการ (เกิน 3) ปิดหรือรวมของเดิมก่อน"; exit 1; }

  guard:                      # กฎใน AGENTS.md + Jira key + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: rules
        env: { TITLE: "${{ github.event.pull_request.title }}", HEAD_REF: "${{ github.head_ref }}" }
        run: bash scripts/ci/guard.sh "origin/${{ github.base_ref }}" "$HEAD_REF" "$TITLE"
      - name: secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="origin/${{ github.base_ref }}..HEAD" --redact -v

  ci:
    uses: ./.github/workflows/ci.yml

  summary:                    # คอมเมนต์ระดับความเสี่ยงใน PR (ไม่บล็อก)
    needs: [risk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", TIER: "${{ needs.risk.outputs.tier }}", MANUAL: "${{ needs.risk.outputs.manual }}", AUTO: "${{ needs.risk.outputs.automerge }}" }
        run: |
          {
            echo "**ระดับความเสี่ยง: $TIER** · merge อัตโนมัติ: $AUTO"
            [ "$MANUAL" = true ] && echo "แตะไฟล์ใน MANUAL_MERGE (migration / CI / signing / สิทธิ์) → **คนต้องรีวิวและ merge เอง**"
            case "$TIER" in
              high) echo "ตรวจ RLS/สิทธิ์และผลของ pgTAP ก่อน merge";;
              medium) echo "ผู้รีวิว 1 คน";;
              low) echo "ทางด่วน: อ่านสรุปแล้วอนุมัติได้";;
            esac
          } > "$RUNNER_TEMP/c.md"
          gh pr comment "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --body-file "$RUNNER_TEMP/c.md"

  automerge:                  # กติกา v2: PR ของ agent ที่ไม่แตะ MANUAL_MERGE → merge เองเมื่อ CI ผ่านครบ
    needs: [risk, guard, ci]
    if: success() && needs.risk.outputs.automerge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write, pull-requests: write, actions: write }
    steps:
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REPO: "${{ github.repository }}", PR: "${{ github.event.pull_request.number }}", SHA: "${{ github.event.pull_request.head.sha }}" }
        run: |
          gh pr merge "$PR" -R "$REPO" --squash --delete-branch --match-head-commit "$SHA" \
            || { echo "::warning::merge อัตโนมัติไม่สำเร็จ ให้คน merge เอง"; exit 0; }
          # merge ด้วย GITHUB_TOKEN ไม่ trigger workflow main จึงสั่งเอง
          gh workflow run main.yml -R "$REPO" --ref main
