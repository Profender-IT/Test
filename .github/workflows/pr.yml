# Guardrails + Orchestration ของทุก PR · รันบน self-hosted runner ที่ VM ops (.177) โค้ดไม่ต้องออกไป build ข้างนอก
# ตั้ง branch protection / ruleset ให้ job ทั้งหมดเป็น required status checks
name: pr
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:                       # ชั้น 3: จัดระดับ + จำกัดขนาด + จำกัด PR ค้างของ agent
    runs-on: [self-hosted, ops]
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.r.outputs.tier }}
      automerge: ${{ steps.r.outputs.automerge }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: r
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: bash scripts/ci/risk.sh "origin/${{ github.base_ref }}" "${{ github.head_ref }}" "$TITLE"
      - name: จำกัด PR ของ agent ที่เปิดพร้อมกัน (ไม่เกิน 3)
        if: startsWith(github.head_ref, 'agent/')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          n=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&per_page=100" \
              | jq '[.[] | select(.head.ref | startswith("agent/"))] | length') || { echo "เช็กจำนวนไม่ได้ ข้าม"; exit 0; }
          echo "PR ของ agent ที่เปิดอยู่: $n"
          [ "$n" -le 3 ] || { echo "::error::agent เปิด PR ค้างรีวิว $n รายการ (เกิน 3) ปิดหรือรวมของเดิมก่อน"; exit 1; }

  guard:                      # ชั้น 2: กฎใน AGENTS.md + Jira key
    runs-on: [self-hosted, ops]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: rules
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: bash scripts/ci/guard.sh "origin/${{ github.base_ref }}" "${{ github.head_ref }}" "$TITLE"
      - name: secret scan (gitleaks)
        run: |
          [ -x ~/bin/gitleaks ] || { mkdir -p ~/bin; curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz -C ~/bin gitleaks; }
          ~/bin/gitleaks git . --log-opts="origin/${{ github.base_ref }}..HEAD" --redact -v

  test:                       # ชั้น 2: lint, type, unit, migration บนฐานว่าง (ฐานทดสอบ ไม่ใช่ข้อมูลจริง)
    runs-on: [self-hosted, ops]
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:0.8.2-pg18
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: roombooking }
        ports: ["127.0.0.1:55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:55432/roombooking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable && pnpm i --frozen-lockfile
      - run: pnpm lint && pnpm typecheck
      - name: migrations (ฐานว่าง → ล่าสุด, รันซ้ำต้องไม่พัง)
        run: CREATE_ROLES=1 bash scripts/db/migrate.sh && bash scripts/db/migrate.sh
      - run: pnpm test -- --coverage
      - name: base path
        run: pnpm --filter web build && grep -q '/roombooking/assets/' apps/web/dist/index.html

  build:                      # ชั้น 2: image + ช่องโหว่
    needs: [risk, guard, test]
    runs-on: [self-hosted, ops]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          for d in apps/*/; do s=$(basename "$d"); [ -f "$d/Dockerfile" ] || continue
            docker build -t roombooking/$s:pr-${{ github.event.pull_request.number }} -f "$d/Dockerfile" .
          done
      - run: |
          for d in apps/*/; do s=$(basename "$d"); [ -f "$d/Dockerfile" ] && [ "$s" != web ] || continue
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /var/cache/trivy:/root/.cache/trivy aquasec/trivy:0.57.1 image \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed roombooking/$s:pr-${{ github.event.pull_request.number }}
          done

  summary:                    # ชั้น 1+3: คอมเมนต์ระดับความเสี่ยง + สรุปโดย AI ในโรงงาน (ไม่บล็อก)
    needs: [risk]
    runs-on: [self-hosted, ops]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          {
            echo "**ระดับความเสี่ยง: ${{ needs.risk.outputs.tier }}**"
            case "${{ needs.risk.outputs.tier }}" in
              high) echo "ต้องมี CODEOWNER อนุมัติ และรันบน staging อย่างน้อย 1 กะก่อน release";;
              medium) echo "ผู้รีวิว 1 คน";;
              low) echo "ทางด่วน: อ่านสรุปแล้วอนุมัติได้";;
            esac
            echo
            bash scripts/ci/pr_summary.sh "origin/${{ github.base_ref }}"
          } > "$RUNNER_TEMP/c.md"
          jq -n --rawfile b "$RUNNER_TEMP/c.md" '{body:$b}' | curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -d @- >/dev/null

  automerge:                  # กติกา v2: PR ของ agent ระดับ low/medium → merge เองเมื่อ CI ผ่านครบ · high = คน merge
    needs: [risk, guard, test, build]
    if: success() && needs.risk.outputs.automerge == 'true'
    runs-on: [self-hosted, ops]
    timeout-minutes: 5
    permissions: { contents: write, pull-requests: write, actions: write }
    steps:
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REPO: "${{ github.repository }}", PR: "${{ github.event.pull_request.number }}", BR: "${{ github.head_ref }}", SHA: "${{ github.event.pull_request.head.sha }}" }
        run: |
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          r=$(api -X PUT "https://api.github.com/repos/$REPO/pulls/$PR/merge" -d "{\"merge_method\":\"squash\",\"sha\":\"$SHA\"}")
          echo "$r"; echo "$r" | grep -q '"merged": *true' || { echo "::warning::merge อัตโนมัติไม่สำเร็จ ให้คน merge เอง"; exit 0; }
          api -X DELETE "https://api.github.com/repos/$REPO/git/refs/heads/$BR" || true
          # merge ด้วย GITHUB_TOKEN ไม่ trigger workflow main จึงสั่ง deploy staging เอง
          api -X POST "https://api.github.com/repos/$REPO/actions/workflows/main.yml/dispatches" -d '{"ref":"main"}'
