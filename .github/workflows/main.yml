# merge เข้า main → ทดสอบชุดเดียวกับ PR → build APK ของ staging เก็บเป็น artifact
# ไม่ deploy อะไรขึ้น Supabase: migration ไป staging/production คนรัน `supabase db push` เอง (ADR 0001)
name: main
on:
  push:
    branches: [main]
  workflow_dispatch: {}      # automerge ของ pr.yml สั่ง

permissions:
  contents: read

concurrency: { group: main, cancel-in-progress: false }

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  apk-staging:                # APK ที่ชี้ไป Supabase project ของ staging (ค่าจาก Environment "staging")
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    defaults: { run: { working-directory: app } }
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: ตรวจว่าตั้งค่า Environment staging แล้ว
        id: cfg
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::ยังไม่ตั้ง vars SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY ใน Environment staging · ข้าม build"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - if: steps.cfg.outputs.ok == 'true'
        uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.0", channel: stable, cache: true }
      - if: steps.cfg.outputs.ok == 'true'
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=APP_ENV=staging \
            --build-number=${{ github.run_number }}
      - if: steps.cfg.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: room-booking-staging-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
