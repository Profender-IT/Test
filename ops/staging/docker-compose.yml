# Staging บน ops (.177) · วางที่ /opt/staging-roombooking · http://192.168.110.177:8089/roombooking/
# แยกจาก staging ของ SCADA ทั้งหมด (project name, network, พอร์ต, DB) · ข้อมูลสังเคราะห์เท่านั้น
name: roombooking-staging
networks: { frontend: {}, backend: {} }
services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    ports: ["8089:80"]
    command: ["--providers.docker=true","--providers.docker.exposedbydefault=false","--providers.docker.network=roombooking-staging_frontend",
              "--providers.docker.constraints=Label(`stack`,`roombooking-staging`)","--entrypoints.web.address=:80"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [frontend]
    mem_limit: 96m
  db:
    image: pgvector/pgvector:0.8.2-pg18
    restart: unless-stopped
    environment: { POSTGRES_DB: roombooking, POSTGRES_USER: roombooking, POSTGRES_PASSWORD: "${STG_DB_PASS}" }
    volumes: ["db18:/var/lib/postgresql"]
    networks: [backend]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U roombooking -d roombooking"], interval: 3s, retries: 20 }
    mem_limit: 384m
  redis:
    image: redis:7
    restart: unless-stopped
    networks: [backend]
    mem_limit: 96m
  web:
    image: roombooking/web:${TAG}
    profiles: ["app"]
    restart: unless-stopped
    networks: [frontend]
    mem_limit: 96m
    labels: ["stack=roombooking-staging","traefik.enable=true","traefik.http.routers.roombooking-web.rule=PathPrefix(`${BASE_PATH}`)",
             "traefik.http.routers.roombooking-web.priority=1","traefik.http.services.roombooking-web.loadbalancer.server.port=8080"]
  api:
    image: roombooking/api:${TAG}
    profiles: ["app"]
    restart: unless-stopped
    networks: [frontend, backend]
    environment: { DATABASE_URL: "postgres://roombooking_api:${STG_API_PASS}@db:5432/roombooking", REDIS_URL: "redis://redis:6379",
                   BASE_PATH: "${BASE_PATH}", PORT: "3000", GIT_SHA: "${TAG}", APP_VERSION: "0.0.0-staging" }
    depends_on: [db, redis]
    mem_limit: 256m
    labels: ["stack=roombooking-staging","traefik.enable=true","traefik.http.routers.roombooking-api.rule=PathPrefix(`${BASE_PATH}/api`)",
             "traefik.http.routers.roombooking-api.priority=10","traefik.http.services.roombooking-api.loadbalancer.server.port=3000"]
volumes: { db18: {} }
