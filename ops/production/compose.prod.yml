# production แบบ VPS หรือ server ในโรงงาน · image จาก GHCR (หรือ build ในเครื่อง) · ทุกอย่างที่ต่างกันอยู่ใน .env
# บน AWS ใช้ค่า env ชุดเดียวกันกับ ECS แทนไฟล์นี้ได้
name: roombooking-prod
services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: ["--providers.docker=true","--providers.docker.exposedbydefault=false",
              "--entrypoints.web.address=:80","--entrypoints.web.http.redirections.entrypoint.to=websecure",
              "--entrypoints.websecure.address=:443",
              "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web","--certificatesresolvers.le.acme.email=${ACME_EMAIL}",
              "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro","letsencrypt:/letsencrypt"]
  web:
    image: ${IMAGE_PREFIX}/web:${TAG}
    restart: unless-stopped
    labels: ["traefik.enable=true","traefik.http.routers.web.rule=Host(`${DOMAIN}`) && PathPrefix(`${BASE_PATH}`)",
             "traefik.http.routers.web.tls.certresolver=le","traefik.http.services.web.loadbalancer.server.port=8080"]
  api:
    image: ${IMAGE_PREFIX}/api:${TAG}
    restart: unless-stopped
    env_file: [api.env]               # DATABASE_URL, PGSSLMODE, REDIS_URL, STORAGE_*, OIDC_*, BASE_PATH ...
    labels: ["traefik.enable=true","traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`${BASE_PATH}/api`)",
             "traefik.http.routers.api.tls.certresolver=le","traefik.http.services.api.loadbalancer.server.port=3000"]
  worker:
    image: ${IMAGE_PREFIX}/worker:${TAG}
    restart: unless-stopped
    env_file: [worker.env]
    profiles: ["worker"]
volumes: { letsencrypt: {} }
